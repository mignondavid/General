<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>David Mignon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000000; --ink:#e9ddd2; --muted:#8a7f76; --line:#3a332e;
  color-scheme: dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#000000; --ink:#e9ddd2; --muted:#8a7f76; --line:#3a332e; } }
:root[data-theme="dark"]{ --bg:#000000; --ink:#e9ddd2; --muted:#8a7f76; --line:#3a332e; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);overflow:hidden;
  font-family:"Fraunces",Georgia,"Times New Roman",serif;cursor:crosshair;touch-action:none}
canvas{display:block;width:100%;height:100%}
#stage{position:fixed;inset:0}
.name{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(env(safe-area-inset-bottom,0px) + 4vh);
  margin:0;font-weight:300;font-size:clamp(1.1rem,2.6vw,1.6rem);
  letter-spacing:.02em;color:var(--ink);opacity:0;transition:opacity 1.6s ease .6s;
  white-space:nowrap;pointer-events:none}
.name small{display:block;text-align:center;font-size:.55em;color:var(--muted);margin-top:.4em;letter-spacing:.04em}
body.ready .name{opacity:1}
#social{position:fixed;inset:0;pointer-events:none;margin:0;padding:0}
#social a{position:absolute;left:0;top:0;pointer-events:auto;display:block;width:52px;height:52px;
  text-decoration:none;color:var(--ink);cursor:pointer;will-change:transform;opacity:0;transition:opacity 1.6s ease 1s;
  perspective:420px;border-radius:24%}
body.ready #social a{opacity:1}
#social .tile{position:absolute;inset:0;border-radius:23%;overflow:hidden;transform-style:preserve-3d;will-change:transform;
  --hx:30%;--hy:25%;--sx:0px;--sy:6px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.28), inset 0 -2px 3px rgba(0,0,0,.35),
              0 1px 0 rgba(255,255,255,.08), var(--sx) var(--sy) 16px rgba(0,0,0,.65), calc(var(--sx)*.4) calc(var(--sy)*.4) 4px rgba(0,0,0,.5);
  transition: box-shadow .4s ease}
#social .tile img{width:100%;height:100%;display:block}
#social .tile::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(circle at var(--hx) var(--hy), rgba(255,255,255,.42), rgba(255,255,255,.08) 38%, rgba(0,0,0,0) 60%),
             linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,0) 45%, rgba(0,0,0,.18));
  mix-blend-mode:screen}
#social .tile::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:1;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.14)}
#social a .lbl{position:absolute;top:calc(100% + 10px);left:50%;transform:translateX(-50%);
  font-size:.8rem;color:var(--muted);white-space:nowrap;opacity:0;transition:opacity .35s ease;pointer-events:none}
#social a.on .tile, #social a:focus-visible .tile{
  box-shadow: inset 0 1px 0 rgba(255,255,255,.35), inset 0 -2px 3px rgba(0,0,0,.3),
              0 0 22px rgba(217,144,47,.55), 0 0 60px rgba(217,144,47,.22), var(--sx) var(--sy) 18px rgba(0,0,0,.6)}
#social a.on .lbl, #social a:focus-visible .lbl{opacity:1;color:var(--ink)}
#social a:focus-visible{outline:2px solid var(--ink);outline-offset:5px}
@media (hover:none){ #social a .lbl{opacity:.75} }
@media (prefers-reduced-motion: reduce){ .name{transition:none} }
</style>
</head>

const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.setClearColor(0x000000,1);
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35,1,0.1,100);
camera.position.set(0,0,7);

/* ---------- Helmet: flat ink-poster layers that tilt with the pointer ---------- */
const loader = new THREE.TextureLoader();
let loaded = 0; const done = ()=>{ if(++loaded===3) document.body.classList.add('ready'); };
const tex = (src,srgb)=>{ const t = loader.load(src,done); if(srgb) t.encoding = THREE.sRGBEncoding;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy(); return t; };
const shellTex = tex(SHELL,true), faceTex = tex(FACE,true), maskTex = tex(MASK,false);

const HW = 740/950*2, HH = 2;              // layer size, from the 740x950 crop
const card = new THREE.PlaneGeometry(HW,HH);
const helmet = new THREE.Group();
function layer(mat,z,order,scale=1){
  const m = new THREE.Mesh(card,mat); m.position.z = z; m.scale.setScalar(scale); m.renderOrder = order;
  helmet.add(m); return m;
}
const flat = (map)=>new THREE.MeshBasicMaterial({map, transparent:true, depthWrite:false});
// amber offset print behind everything, peeks out as the helmet turns
const printMat = new THREE.ShaderMaterial({
  uniforms:{ uMask:{value:maskTex} },
  vertexShader:`varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader:`varying vec2 vUv; uniform sampler2D uMask;
    void main(){ float a = texture2D(uMask,vUv).r; gl_FragColor = vec4(vec3(0.85,0.56,0.18), a*0.9); }`,
  transparent:true, depthWrite:false
});
const print = layer(printMat,-0.26,1,1.03); print.position.x = 0.022; print.position.y = -0.022;
layer(flat(faceTex),-0.14,2,1.02);         // face sits back inside the visor
layer(flat(shellTex),0,3);
// a soft glare band across the visor glass that slides with the pointer
const glareMat = new THREE.ShaderMaterial({
  uniforms:{ uMask:{value:maskTex}, uShift:{value:0} },
  vertexShader:`varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader:`varying vec2 vUv; uniform sampler2D uMask; uniform float uShift;
    void main(){
      float a = texture2D(uMask,vUv).g;
      float d = (vUv.x - uShift) + (vUv.y - 0.5)*0.55;
      float band = smoothstep(0.07,0.0,abs(d)) + 0.5*smoothstep(0.022,0.0,abs(d-0.11));
      gl_FragColor = vec4(vec3(0.95,0.90,0.84), a*band*0.22);
    }`,
  transparent:true, depthWrite:false, blending:THREE.AdditiveBlending
});
layer(glareMat,0.08,4);
const rig = new THREE.Group(); rig.add(helmet); scene.add(rig);

/* ---------- Lights ---------- */
scene.add(new THREE.AmbientLight(0xffffff,0.74));
const key = new THREE.DirectionalLight(0xffffff,0.42); key.position.set(-3,4,5); scene.add(key);

/* ---------- Cursor light + background glow ---------- */
const cursorLight = new THREE.PointLight(0xffc98a, 0.55, 0, 1);
const lightPos = new THREE.Vector3(0,0,2.2);
cursorLight.position.copy(lightPos); scene.add(cursorLight);

const glowMat = new THREE.ShaderMaterial({
  uniforms:{ uCenter:{value:new THREE.Vector2(0,0)}, uStrength:{value:0} },
  vertexShader:`varying vec2 vP; void main(){ vP = position.xy; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader:`varying vec2 vP; uniform vec2 uCenter; uniform float uStrength;
    void main(){
      float d = length(vP - uCenter);
      vec3 amber = vec3(0.80,0.46,0.15), teal = vec3(0.22,0.45,0.50);
      float core = exp(-d*d/16.0), halo = exp(-d*d/110.0);
      float pool = exp(-dot(vP,vP)/50.0);
      vec3 col = amber*core*0.20 + teal*halo*0.07 + vec3(0.30,0.19,0.13)*pool*0.06;
      float n = fract(sin(dot(gl_FragCoord.xy, vec2(12.9898,78.233)))*43758.5453);
      gl_FragColor = vec4(col*uStrength + (n-0.5)/255.0, 1.0);
    }`,
  depthWrite:false
});
const GLOW_Z = -8;
const glow = new THREE.Mesh(new THREE.PlaneGeometry(90,90), glowMat);
glow.position.z = GLOW_Z; glow.renderOrder = -1; scene.add(glow);
const glowPlane = new THREE.Plane(new THREE.Vector3(0,0,1), -GLOW_Z);
const gHit = new THREE.Vector3(), gTarget = new THREE.Vector2();

/* ---------- Floating dust ---------- */
const DUST = 900;
const dPos = new Float32Array(DUST*3), dSeed = new Float32Array(DUST*3);
for(let i=0;i<DUST;i++){
  dPos[i*3]   = (Math.random()-0.5)*28;
  dPos[i*3+1] = (Math.random()-0.5)*18;
  dPos[i*3+2] = -10 + Math.random()*13;
  dSeed[i*3]   = 0.04 + Math.random()*0.10;   // rise speed
  dSeed[i*3+1] = Math.random()*6.2832;        // phase
  dSeed[i*3+2] = Math.random();               // tint
}
const dGeo = new THREE.BufferGeometry();
dGeo.setAttribute('position', new THREE.BufferAttribute(dPos,3));
dGeo.setAttribute('aSeed', new THREE.BufferAttribute(dSeed,3));
const dustMat = new THREE.ShaderMaterial({
  uniforms:{ uTime:{value:0}, uPointer:{value:new THREE.Vector2()}, uScale:{value:1000}, uLight:{value:new THREE.Vector3()} },
  vertexShader:`
    attribute vec3 aSeed; uniform float uTime; uniform vec2 uPointer; uniform float uScale; uniform vec3 uLight;
    varying float vA; varying float vTint;
    void main(){
      vec3 p = position;
      p.y = mod(p.y + uTime*aSeed.x + 9.0, 18.0) - 9.0;
      p.x += sin(uTime*0.25 + aSeed.y)*0.3;
      p.xy -= uPointer * p.z * 0.12;            // parallax: near and far move opposite ways
      vec4 mv = modelViewMatrix*vec4(p,1.0);
      float blur = abs(p.z + 1.0);              // focus plane just behind the helmet
      gl_PointSize = min((0.03 + blur*0.022) * uScale / -mv.z, 110.0);
      float lit = exp(-dot(p.xy - uLight.xy*2.2, p.xy - uLight.xy*2.2)/14.0);
      vA = (0.55 + 0.45*sin(uTime*0.8 + aSeed.y*3.0)) * (1.0 + 2.0*lit) / (1.0 + blur*blur*0.14);
      vTint = aSeed.z;
      gl_Position = projectionMatrix*mv;
    }`,
  fragmentShader:`
    varying float vA; varying float vTint;
    void main(){
      float d = length(gl_PointCoord - 0.5);
      float a = smoothstep(0.5, 0.0, d); a *= a;
      vec3 col = mix(vec3(1.0,0.80,0.58), vec3(0.62,0.84,0.90), step(0.8, vTint));
      gl_FragColor = vec4(col, a*vA*0.5);
    }`,
  transparent:true, depthWrite:false, blending:THREE.AdditiveBlending
});
scene.add(new THREE.Points(dGeo, dustMat));

/* ---------- Floating social links ---------- */
const icons = [...document.querySelectorAll('#social a')].map((el,i)=>({el, tile:el.querySelector('.tile'), seed:i*2.1, ndc:new THREE.Vector2(), base:new THREE.Vector3()}));
let hovered = null;
icons.forEach(ic=>{
  const on = ()=>{ hovered = ic; lastMove = performance.now(); ic.el.classList.add('on'); };
  const off = ()=>{ if(hovered===ic) hovered = null; ic.el.classList.remove('on'); };
  ic.el.addEventListener('pointerenter',on); ic.el.addEventListener('pointerleave',off);
  ic.el.addEventListener('focus',on); ic.el.addEventListener('blur',off);
});
function layoutIcons(){
  const portrait = camera.aspect < 0.85;
  const L = portrait ? [[-1.05,-1.7,0.3],[0,-1.98,0.6],[1.05,-1.7,0.1]]
                     : [[1.85,0.95,0.4],[-1.95,0.15,0.1],[1.6,-1.15,0.7]];
  icons.forEach((ic,i)=>ic.base.set(L[i][0],L[i][1],L[i][2]));
}
const pv = new THREE.Vector3();
function placeIcons(t){
  const w = window.innerWidth, h = window.innerHeight, ptr = dustMat.uniforms.uPointer.value;
  const k = reduce ? 0 : t*0.001;
  icons.forEach(ic=>{
    pv.copy(ic.base);
    pv.x += Math.sin(k*0.5 + ic.seed)*0.06;
    pv.y += Math.sin(k*0.7 + ic.seed*1.3)*0.08;
    pv.x -= ptr.x*pv.z*0.12; pv.y -= ptr.y*pv.z*0.12;     // same parallax as the dust
    pv.project(camera);
    ic.ndc.set(pv.x, pv.y);
    const sc = 0.9 + ic.base.z*0.25;
    ic.el.style.transform = `translate(${(pv.x*0.5+0.5)*w}px, ${(-pv.y*0.5+0.5)*h}px) translate(-50%,-50%) scale(${sc})`;
    // each tile turns its face toward the pointer; gloss and shadow follow the cursor light
    const dx = THREE.MathUtils.clamp((ptr.x - pv.x)*camera.aspect, -1.5, 1.5);
    const dy = THREE.MathUtils.clamp(ptr.y - pv.y, -1.5, 1.5);
    const lift = hovered===ic ? 1.12 : 1;
    ic.tile.style.transform = `rotateY(${dx*22}deg) rotateX(${dy*22}deg) translateZ(${hovered===ic?10:0}px) scale(${lift})`;
    ic.tile.style.setProperty('--hx', `${50 + dx*35}%`);
    ic.tile.style.setProperty('--hy', `${50 - dy*35}%`);
    ic.tile.style.setProperty('--sx', `${-dx*7}px`);
    ic.tile.style.setProperty('--sy', `${6 + dy*7}px`);
  });
}
const rim = new THREE.DirectionalLight(0xffd9b0,0.25); rim.position.set(4,-2,2); scene.add(rim);

function resize(){
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w,h,false);
  camera.aspect = w/h;
  camera.position.z = 6.2 / Math.max(Math.min(1,w/h),0.55);
  camera.updateProjectionMatrix();
  layoutIcons();
  dustMat.uniforms.uScale.value = h*renderer.getPixelRatio()/(2*Math.tan(THREE.MathUtils.degToRad(camera.fov/2)));
}
window.addEventListener('resize',resize); resize();

/* ---------- Interaction ---------- */
const ndc = new THREE.Vector2(0,0);
let lastMove = -1e9, pulse = 0;
function onPoint(x,y){
  ndc.x = (x/window.innerWidth)*2-1;
  ndc.y = -(y/window.innerHeight)*2+1;
  lastMove = performance.now();
}
window.addEventListener('pointermove',e=>onPoint(e.clientX,e.clientY));
window.addEventListener('pointerdown',e=>{ onPoint(e.clientX,e.clientY); pulse = 1; });

const ray = new THREE.Raycaster();
const plane = new THREE.Plane(new THREE.Vector3(0,0,1), -2.2);
const aim = new THREE.Vector3(0,0,5), want = new THREE.Vector3();
const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const MAX = THREE.MathUtils.degToRad(20);

function tick(t){
  let target = ndc;
  if(t - lastMove > 4000 && !reduce){
    const k = t*0.00035;
    target = new THREE.Vector2(Math.sin(k*1.3)*0.45, Math.sin(k*0.9+1)*0.3);
  }
  if(hovered) target = hovered.ndc;            // lock onto the icon under the pointer
  ray.setFromCamera(target,camera);
  ray.ray.intersectPlane(plane,want);
  // the pointer is the light: move the point light, the glow and the dust parallax
  lightPos.lerp(want, reduce ? 1 : 0.08); cursorLight.position.copy(lightPos);
  if(ray.ray.intersectPlane(glowPlane,gHit)){ gTarget.set(gHit.x*0.7, gHit.y*0.7); }
  glowMat.uniforms.uCenter.value.lerp(gTarget, reduce ? 1 : 0.06);
  dustMat.uniforms.uPointer.value.lerp(target, reduce ? 1 : 0.05);
  dustMat.uniforms.uLight.value.copy(lightPos);
  const dir = want.clone().normalize();
  if(Math.acos(dir.z) > MAX){
    const xy = new THREE.Vector2(dir.x,dir.y).normalize().multiplyScalar(Math.sin(MAX));
    dir.set(xy.x,xy.y,Math.cos(MAX));
  }
  aim.lerp(dir.multiplyScalar(5), reduce ? 1 : 0.12);
  helmet.lookAt(aim);

  // glare slides across the visor opposite the pointer; a tap gives a quick bump
  glareMat.uniforms.uShift.value += ((0.5 - target.x*0.35) - glareMat.uniforms.uShift.value)*0.08;
  pulse *= 0.92;
  if(!reduce) rig.scale.setScalar(1 + Math.sin(t*0.0012)*0.006 + pulse*0.035);
  glowMat.uniforms.uStrength.value += (1 - glowMat.uniforms.uStrength.value) * 0.02;
  dustMat.uniforms.uTime.value = reduce ? 0 : t*0.001;
  placeIcons(t);
  renderer.render(scene,camera);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
})();
</script>
</body>
</html>
